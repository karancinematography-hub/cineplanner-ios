name: cineplanner
description: Offline cinematography and lighting planner.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.5.1
  sqflite_sqlcipher: ^3.4.1
  sqflite_common: ^2.5.6
  flutter_secure_storage: ^11.2.0
  path: ^1.9.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  archive: ^4.6.0
  crypto: ^3.0.8
  file_selector: ^1.1.0
  image: ^4.12.0
  image_picker: ^1.2.4
  timezone: ^0.11.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
